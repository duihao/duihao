version: '3'

vars:
  APP_NAME: "duihao"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  # Release version — SINGLE SOURCE OF TRUTH: build/windows/VERSION.
  # Injected into every platform binary via -ldflags "-X main.Version=...";
  # the windows build uses the same value for exe file properties and the
  # installer. Bump build/windows/VERSION, then run:
  #   python build/windows/sync_version.py
  # (mirrors it into build/config.yml + the three info*.json).
  # Never leave this empty for a release: an empty VERSION keeps main.Version
  # at "dev", which flips devBuild=true and silently disables update downloads.
  VERSION:
    sh: cat build/windows/VERSION 2>/dev/null | tr -d '\r\n' || cat ../windows/VERSION 2>/dev/null | tr -d '\r\n' || echo ""

  # Build metadata injected via -ldflags "-X main.BuildCommit=...". Empty
  # outside a git checkout (release tarballs) — the About page hides the
  # suffix then. BUILD_DATE is UTC ISO-ish "YYYY-MM-DDTHH:MM" for quick
  # package-age identification — NO space allowed (it would split the
  # -ldflags argument). Both are cosmetic and never parsed by the updater.
  BUILD_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null | tr -d '\r\n' || echo ""
  BUILD_DATE:
    sh: date -u '+%Y-%m-%dT%H:%M' 2>/dev/null | tr -d '\r\n' || echo ""

  # Target architecture, forwarded to per-platform build tasks
  # (e.g. `wails3 build ARCH=arm64` cross-compiles windows/arm64).
  ARCH: '{{.ARCH | default ""}}'
  # Extra Go build tags appended to the production build, e.g. gtk3 for the
  # legacy WebKit2GTK 4.1 Linux stack.
  EXTRA_TAGS: '{{.EXTRA_TAGS | default ""}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"
        vars:
          VERSION: '{{.VERSION}}'
          ARCH: '{{.ARCH}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          BUILD_COMMIT: '{{.BUILD_COMMIT}}'
          BUILD_DATE: '{{.BUILD_DATE}}'
          # M6: edition build passes its own version-info JSON for exe properties
          INFO_JSON: '{{.INFO_JSON | default ""}}'

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"
        vars:
          VERSION: '{{.VERSION}}'
          # M6 edition packaging: brand include + bundled editions.json
          EDITION: '{{.EDITION | default ""}}'
          EDITIONS_BUNDLE: '{{.EDITIONS_BUNDLE | default ""}}'

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  android:compile:check:
    summary: Cross-compiles all Go packages for android (no SDK needed; CGO off)
    cmds:
      - GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -tags android,debug $(go list ./... | grep -v '/build/android')

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

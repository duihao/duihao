{{define "body"}}
<section id="v-home">
  <!-- 工具区：宽屏左栏（搜索 + 观看记录 + 分类 + 排序 + 扫描）/ 窄屏回落成顶部横排 -->
  <div class="vt-shell">
    <aside class="vt-rail">
      <div class="vt-rail-search">
        <div class="vt-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="v-q" placeholder="搜片名 / 演员 / 导演 / 标签" autocomplete="off">
        </div>
      </div>

      <button id="v-hist-btn" class="vt-hist-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span class="vt-chip-n">观看记录</span><i id="v-hist-n"></i>
      </button>

      <div class="vt-rail-h">分类</div>
      <div class="vt-chips" id="v-cats"></div>
      <div class="vt-rail-tools">
        <select id="v-sort" title="排序">
          <option value="recent">最近添加</option>
          <option value="rating">评分最高</option>
          <option value="year">年份最新</option>
          <option value="title">名称排序</option>
        </select>
        <button id="v-scan" class="vt-scan">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 3v6h-6"/></svg>
          扫描媒体库
        </button>
      </div>
    </aside>

    <div class="vt-main">
      <!-- 观看记录（左栏选中「观看记录」时出现，按最后观看时间倒序） -->
      <div class="vt-hist" id="v-hist" hidden></div>

      <!-- 海报墙 -->
      <div class="vt-wall" id="v-wall"></div>
      <div class="vt-empty muted" id="v-empty" hidden>还没有影片。把视频放进网盘 <b>_appfiles/video/&lt;分类&gt;/</b> 目录后，点右上「扫描媒体库」。</div>
      <div class="vt-foot" id="v-foot"></div>
    </div>
  </div>
</section>

<!-- 播放器（全屏覆盖层） -->
<div id="v-player" hidden>
  <video id="v-video" controls playsinline preload="metadata"></video>
  <div class="vpl-top">
    <button id="v-back" title="返回 (Esc)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      返回
    </button>
    <span id="v-pl-title"></span>
    <button id="v-next" hidden>下一集</button>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="mask" id="v-mask" hidden>
  <div class="dlg vt-dlg">
    <button class="vt-close" id="v-close" title="关闭">✕</button>
    <div class="vt-dlg-body">
      <div class="vt-dlg-poster" id="v-d-poster"></div>
      <div class="vt-dlg-info">
        <h2 id="v-d-title"></h2>
        <div class="vt-dlg-meta" id="v-d-meta"></div>
        <p class="vt-dlg-intro" id="v-d-intro"></p>
        <div class="vt-dlg-files" id="v-d-files"></div>
        <div class="btns">
          <button id="v-edit">编辑信息</button>
          <button id="v-play" class="primary">▶ 播放</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 编辑信息弹窗 -->
<div class="mask" id="v-emask" hidden>
  <div class="dlg vt-edlg">
    <h3>编辑影片信息</h3>
    <label>片名<input id="v-e-title"></label>
    <div class="vt-erow">
      <label>年份<input id="v-e-year" type="number" min="1900" max="2100"></label>
      <label>评分<input id="v-e-rating" type="number" min="0" max="10" step="0.1"></label>
      <label>类型
        <select id="v-e-kind">
          <option value="movie">电影</option>
          <option value="series">剧集</option>
          <option value="variety">综艺</option>
          <option value="anime">动漫</option>
          <option value="doc">纪录片</option>
          <option value="mv">MV</option>
          <option value="course">课程</option>
        </select>
      </label>
    </div>
    <label>标签（逗号分隔）<input id="v-e-tags" placeholder="科幻,悬疑"></label>
    <div class="vt-erow">
      <label>地区<input id="v-e-area"></label>
      <label>导演<input id="v-e-director"></label>
    </div>
    <label>主演<input id="v-e-actors"></label>
    <label>简介<textarea id="v-e-intro" rows="4"></textarea></label>
    <div class="btns">
      <button id="v-ecancel">取消</button>
      <button id="v-esave" class="primary">保存</button>
    </div>
  </div>
</div>

<script src="/-ui/apps/video.js"></script>
{{end}}
